---
version: "2"
linters:
  # Linters enabled by default (errcheck, govet, ineffassign, staticcheck,
  # unused) remain on.  These are added on top.
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errorlint
    - funlen
    - gocritic
    - goconst
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    errorlint:
      errorf: false
    funlen:
      lines: 60
      statements: 60
    misspell:
      locale: US
    testifylint:
      disable:
        # Suite-style tests read better with plain suite.NoError/Error;
        # fail-fast via Require() is used where the test actually needs it.
        - require-error
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test code favors readability: repeated literals, long table-driven
      # functions, and similar-looking cases are clearer than factoring
      # them out.
      - linters:
          - dupl
          - funlen
          - goconst
        path: _test.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
